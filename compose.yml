name: tea-manufacturing

services:
  db:
    image: postgres:16.14-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tea_manufacturing}
      POSTGRES_USER: ${POSTGRES_USER:-tea_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tea_local_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tea-network

  backend:
    build:
      context: ./backend
      target: development
      args:
        PYTHON_VERSION: "3.12.13"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tea_app:tea_local_password@db:5432/tea_manufacturing}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://tea_test:tea_test_password@test-db:5432/tea_manufacturing_test}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    networks:
      - tea-network

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NODE_VERSION: "22.23.2"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - tea-network

  test-db:
    image: postgres:16.14-trixie
    profiles: ["test"]
    environment:
      POSTGRES_DB: tea_manufacturing_test
      POSTGRES_USER: tea_test
      POSTGRES_PASSWORD: tea_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - tea-network

volumes:
  db_data:
  frontend_node_modules:

networks:
  tea-network:
    driver: bridge
