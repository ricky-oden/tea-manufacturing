name: Manual CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tea-v1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.14-trixie
        env:
          POSTGRES_DB: tea_manufacturing_test
          POSTGRES_USER: tea_test
          POSTGRES_PASSWORD: tea_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tea_test -d tea_manufacturing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tea_test:tea_test_password@localhost:5432/tea_manufacturing_test
      TEST_DATABASE_URL: postgresql+psycopg://tea_test:tea_test_password@localhost:5432/tea_manufacturing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m app.db.test_guard
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
